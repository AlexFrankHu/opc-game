# Nginx 反代 + WSS 升级 + web-demo 静态资源
#
# 上游 app 容器只监听内网；公网入口由 nginx 处理 TLS。
#
# - http://<host>/         -> 308 跳 https
# - https://<host>/        -> /var/www/web-demo（SourceCode/web-demo）
# - https://<host>/api     -> ws://app:10100/   （JSON 网关，websocket 升级）
# - https://<host>/api-bin -> ws://app:10110/   （ioGame BarMessage 二进制帧，websocket 升级）
# - http://<host>/healthz  -> http://app:10199/healthz （健康检查）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lb_json   { server app:10100; keepalive 16; }
upstream lb_iogame { server app:10110; keepalive 16; }
upstream lb_health { server app:10199; }

server {
    listen 80 default_server;
    server_name _;

    # 健康检查 / Let's Encrypt http-01 校验直接走 80
    location = /healthz { proxy_pass http://lb_health/healthz; }
    location /.well-known/acme-challenge/ { root /var/www/web-demo; }

    # 其余 80 流量统统跳 443；如果没装证书就把下面这段注释掉。
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 静态 web-demo
    root /var/www/web-demo;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # JSON 网关 WS 升级
    location /api {
        proxy_pass http://lb_json/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ioGame 原生二进制 WS 升级
    location /api-bin {
        proxy_pass http://lb_iogame/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查（也可以让 LB 直接打 http://<host>/healthz）
    location = /healthz { proxy_pass http://lb_health/healthz; }
    location = /readyz  { proxy_pass http://lb_health/readyz; }
}
