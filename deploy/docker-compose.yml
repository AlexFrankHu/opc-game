# Last Bastion 测试服一键拉起脚本
#
# 启动：cp deploy/.env.example deploy/.env && 编辑 .env，再执行
#       docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# 包含：
#   - app          : ioGame + JSON 网关 + healthz（10100/10110/10210/10199）
#   - mysql        : 8.x，存储 PlayerStore 快照
#   - redis        : 7.x，可选缓存
#   - nginx        : 80/443 反代 + WSS 升级 + web-demo 静态资源
#
# 测试服档位：4C8G，参考 tasks/product/DEPLOYMENT-TESTSERVER.md。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lastbastion}
      MYSQL_USER: ${MYSQL_USER:-lastbastion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lastbastion}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lastbastion-app:dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      STORE_KIND: ${STORE_KIND:-mysql}
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lastbastion}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER:-lastbastion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lastbastion}
      REDIS_URI: redis://redis:6379/0
      LOGIN_SHARED_SECRET: ${LOGIN_SHARED_SECRET:-}
    ports:
      # 仅在不通过 nginx 暴露时使用；生产建议把这两行删掉，只暴露 nginx 80/443
      - "${EXPOSE_JSON_PORT:-10100}:10100"
      - "${EXPOSE_HEALTH_PORT:-10199}:10199"
    volumes:
      - app-data:/data

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${EXPOSE_HTTP_PORT:-80}:80"
      - "${EXPOSE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../SourceCode/web-demo:/var/www/web-demo:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro

volumes:
  mysql-data:
  redis-data:
  app-data:
